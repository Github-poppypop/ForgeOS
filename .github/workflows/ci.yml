name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brain-console
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/brain-console/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build client
        run: npm run build:client

      - name: Run tests
        run: npx tsx --test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage placeholder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/brain-console/coverage
          if-no-files-found: ignore
