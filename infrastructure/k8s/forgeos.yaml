apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeos
  namespace: default
  labels:
    app: forgeos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgeos
  template:
    metadata:
      labels:
        app: forgeos
    spec:
      containers:
        - name: forgeos
          image: forgeos:latest
          ports:
            - containerPort: 7777
          env:
            - name: PORT
              value: "7777"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: forgeos
  namespace: default
  labels:
    app: forgeos
spec:
  type: ClusterIP
  selector:
    app: forgeos
  ports:
    - name: http
      protocol: TCP
      port: 7777
      targetPort: 7777
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeos
  namespace: default
  labels:
    app: forgeos
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: forgeos.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgeos
                port:
                  number: 7777
