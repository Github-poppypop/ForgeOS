name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install
      - run: bunx eslint src/**/*.js --no-eslintrc --env browser,es2021
      - run: npx prettier --check src/ tests/ server.ts
