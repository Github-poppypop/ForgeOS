name: console-ci

on:
  push:
    paths:
      - 'apps/brain-console/**'
  pull_request:
    paths:
      - 'apps/brain-console/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & type-check (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/brain-console/package-lock.json
      - name: Install dependencies
        run: cd apps/brain-console && npm install
      - name: Build client (tsc type-check + vite bundle)
        run: cd apps/brain-console && npm run build:client

  test:
    name: Unit & integration tests + coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/brain-console/package-lock.json
      - name: Install dependencies
        run: cd apps/brain-console && npm install
      - name: Run tests with coverage (lcov)
        run: cd apps/brain-console && mkdir -p coverage && npx tsx --test --experimental-test-coverage --test-reporter=lcov --test-reporter-destination=coverage/lcov.info
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: apps/brain-console/coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Dependency scanning (Snyk)
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd apps/brain-console && npm install
      - name: Snyk test
        run: cd apps/brain-console && npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  e2e:
    name: Playwright e2e (dispatch only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/brain-console/package-lock.json
      - name: Install dependencies
        run: cd apps/brain-console && npm install
      - name: Build client
        run: cd apps/brain-console && npm run build:client
      - name: Start console server
        run: cd apps/brain-console && { nohup npx tsx server.ts > server.log 2>&1 & }
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7777/api/health && break
            sleep 2
          done
      - name: Install Playwright chromium
        run: cd apps/brain-console && npx playwright install chromium
      - name: Run Playwright e2e
        run: cd apps/brain-console && xvfb-run -a npx playwright test
        env:
          BASE_URL: http://127.0.0.1:7777
