name: console-ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (48) CI: lint + typecheck the console sources
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit -p tsconfig.json || true   # typecheck (non-blocking until strict)
      - name: start console + brain
        run: |
          export GBRAIN_HOME="${{ github.workspace }}/.forgeos"
          export OLLAMA_BASE_URL="http://localhost:11434/v1"
          export GBRAIN_EMBEDDING_DIMENSIONS=1024
          unset DATABASE_URL
          bunx gbrain init --pglite --embedding-model ollama:mxbai-embed-large || true
          PORT=7777 bun run server.ts &
          sleep 5
      - name: e2e
        run: bunx playwright test
        env:
          BASE_URL: http://127.0.0.1:7777
