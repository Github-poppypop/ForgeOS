            "secondary-fixed": "#ffddaf",
            tertiary: "#ffb4aa",

            "surface-container-high": "#272a32",

            "on-error-container": "#ffdad6",
            background: "#10131b",
            "outline-variant": "#414755",
            "inverse-surface": "#e0e2ed",
            "primary-fixed": "#d8e2ff"

  <script src="https://browser.sentry-cdn.com/7.64.0/bundle.min.js" crossorigin="anonymous"></script>
  <script>
    if (window.SENTRY_DSN) {
      Sentry.init({ dsn: window.SENTRY_DSN, tracesSampleRate: 0.1 });
    }
  </script>
  <style>
    @keyframes bioPulse {
      0%, 100% { box-shadow: 0 0 10px 0px rgba(173, 198, 255, 0.2); }
      50% { box-shadow: 0 0 25px 5px rgba(173, 198, 255, 0.6); }
    }
    @keyframes synapseFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .organic-glow {
      animation: bioPulse 4s infinite alternate ease-in-out;
    }
    .synapse-line {
      stroke-dasharray: 10 20;
      animation: synapseFlow 2s linear infinite;
    }
    .blur-backdrop {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-base text-body-base antialiased selection:bg-primary-container selection:text-on-primary-container">

  <script type="module" src="/src/app.v5.js"></script>
