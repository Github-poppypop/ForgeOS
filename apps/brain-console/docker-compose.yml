version: "3.9"
services:
  forgeos:
    build:
      context: ../..
      dockerfile: apps/brain-console/Dockerfile
    image: forgeos:latest
    container_name: forgeos
    ports:
      - "7777:7777"
    environment:
      - PORT=7777
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
