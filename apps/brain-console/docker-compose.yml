version: "3.9"
services:
  forgeos:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeos:latest
    container_name: forgeos
    ports:
      - "7777:7777"
    environment:
      - PORT=7777
      - NODE_ENV=production
    restart: unless-stopped
    # node:20-alpine ships Node with a global `fetch`, so the healthcheck
    # needs no extra packages (curl/wget are absent on Alpine by default).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:7777/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
